name: Сообщить об ошибке
description: Расскажи, что пошло не так, чтобы мы могли это исправить.
title: "[Ошибка] "
body:
  - type: textarea
    id: description
    attributes:
      label: Что произошло?
      description: Опиши проблему и укажи название модуля, если это важно.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как повторить ошибку?
      placeholder: "1. Открыть...\n2. Включить...\n3. Увидеть..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Что должно было произойти?
    validations:
      required: false
  - type: input
    id: versions
    attributes:
      label: Версии клиента, Minecraft и NeoForge
      placeholder: "Sollas 1.0.0, Minecraft 1.21.1, NeoForge 21.1.265"
    validations:
      required: true
  - type: textarea
    id: extras
    attributes:
      label: Скриншоты, логи и другие моды
      description: Если есть, приложи снимки и нужные фрагменты лога.
    validations:
      required: false
