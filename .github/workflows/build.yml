name: Сборка клиента

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Java 21 · Minecraft 1.21.1
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Получить исходники
        uses: actions/checkout@v6
      - name: Установить Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Подготовить Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
      - name: Собрать и проверить проект
        run: bash ./gradlew build --no-daemon
      - name: Сохранить JAR
        uses: actions/upload-artifact@v4
        with:
          name: sollas-client-build
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
